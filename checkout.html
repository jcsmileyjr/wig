<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | She Blew My Money | Weave &amp; Wig Subscription</title>
  <meta name="description" content="Demo checkout for the She Blew My Money wig and weave subscription. No payment is collected.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="checkout.css">
  <script src="products.js" defer></script>
  <script src="checkout.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html" aria-label="She Blew My Money home">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">She Blew My Money<small>Weave &amp; Wig Subscription</small></span>
      </a>
    </div>
  </header>

  <main class="checkout-main">
    <div class="container checkout-container">
      <p class="eyebrow">Demo checkout</p>
      <h1>Your subscription</h1>

      <!-- Phase 1 placeholder: the full five-step checkout is built in later phases. -->

      <!-- Shown when the URL has a valid plan -->
      <section id="selected-plan" class="checkout-card" aria-labelledby="selected-plan-heading" hidden>
        <p class="checkout-tag" id="selected-plan-type"></p>
        <h2 id="selected-plan-heading"></h2>
        <p class="checkout-price" id="selected-plan-price"></p>
        <p id="selected-plan-summary"></p>
        <ul class="plan-list" id="selected-plan-included"></ul>
        <p><a href="checkout.html">Choose a different plan</a></p>
      </section>

      <!-- Shown when the plan is missing or not recognised -->
      <section id="plan-picker" class="checkout-card" aria-labelledby="plan-picker-heading" hidden>
        <h2 id="plan-picker-heading">Choose a plan to get started</h2>
        <p id="plan-picker-message"></p>
        <ul class="plan-picker-list" id="plan-picker-list"></ul>
      </section>

      <p class="checkout-demo-note">This is a demonstration. No payment is collected.</p>

      <noscript><p>Checkout needs JavaScript turned on. Please enable it and reload.</p></noscript>
    </div>
  </main>

</body>
</html>
